<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PeakTalent Auditor</title>
  <style>
    :root { --ink: #14213d; --muted: #5b6475; --line: #e3e6ec; --ok: #12805c; --warn: #b54708; --bad: #c4320a; --accent: #fa8c16; }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
    header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
    header h1 span { box-shadow: inset 0 -3px 0 var(--accent); }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 11.5px; }
    main { padding: 12px 16px 14px; }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .ok .dot { background: var(--ok); } .warn .dot { background: var(--warn); } .bad .dot { background: var(--bad); }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0 0 12px; font-size: 12.5px; }
    dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
    button { width: 100%; padding: 8px 12px; border: 0; border-radius: 6px; background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #22325a; } button:disabled { opacity: .45; cursor: default; }
    .keys { margin: 12px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 11.5px; }
    .keys li { display: flex; justify-content: space-between; padding: 2px 0; }
    kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--ink); }
    footer { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1><span>PeakTalent</span> Auditor</h1>
    <p>PII / BII / Credentials &middot; v11.4.6</p>
  </header>
  <main>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Checking this tab…</span></div>
    <dl id="stats" hidden>
      <dt>Suggested labels</dt><dd id="tags">0</dd>
      <dt>Label mistakes</dt><dd id="mistakes">0</dd>
      <dt>Not checked</dt><dd id="notchecked">0</dd>
    </dl>
    <button id="rescan" disabled>Re-audit this page</button>
    <button id="diag" disabled style="margin-top:6px;background:#475569">Copy diagnostics</button>
    <textarea id="diagtext" hidden readonly style="width:100%;height:140px;margin-top:6px;font:11px/1.35 ui-monospace,Menlo,monospace"></textarea>
    <ul class="keys">
      <li><span>Re-audit</span><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>A</kbd></span></li>
      <li><span>Hide / show bar</span><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>H</kbd></span></li>
      <li><span>Diagnostics (console)</span><span><kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>D</kbd></span></li>
    </ul>
  </main>
  <footer>Runs offline. No document text leaves your browser.</footer>
  <script src="popup.js"></script>
</body>
</html>
